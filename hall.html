<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALL OF LULZ | OAO MEGALUL</title>
    <style>
        :root {
            --accent_color: #ff5500;
            --bg: #050505;
            --card-bg: #0f0f0f;
            --text: #e0e0e0;
            --radius: 12px;
            --button_radius: 6px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 40px 8%;
        }

        h1 { color: var(--accent_color); text-transform: uppercase; text-align: center; font-size: 2.5rem; }
        .subtitle { text-align: center; color: #666; margin-bottom: 40px; }

        .trophy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

        .trophy-card {
            background: var(--card-bg);
            border: 1px solid #1a1a1a;
            border-radius: var(--radius);
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .trophy-card:hover { border-color: var(--accent_color); transform: translateY(-5px); }

        .victim-img {
            width: 100px; height: 100px; border-radius: 50%;
            border: 2px solid var(--accent_color); margin-bottom: 15px; object-fit: cover;
        }

        .cta-link {
            display: inline-block; margin-top: 15px; color: #fff; background: #ff3300;
            padding: 8px 20px; text-decoration: none; font-weight: bold;
            border-radius: var(--button_radius); text-transform: uppercase; font-size: 0.8rem;
        }

        .btn-back { display: block; width: fit-content; margin: 40px auto; color: #666; text-decoration: none; }
        .btn-back:hover { color: var(--accent_color); }
    </style>
</head>
<body>

    <h1>HALL OF LULZ</h1>
    <p class="subtitle">Официальный реестр обнуленных систем и наказанных мамонтов.</p>

    <div class="trophy-grid" id="victim-container">
        <p style="text-align: center; grid-column: 1/-1;">Загрузка списка смертников...</p>
    </div>

    <a href="/" class="btn-back">← Вернуться на главную</a>

    <script>
        async function loadVictims() {
            const container = document.getElementById('victim-container');
            try {
                const res = await fetch('/api/get-victims');
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                
                if (!data || !Array.isArray(data) || data.length === 0) {
                    const emptyMsg = document.createElement('p');
                    emptyMsg.style.cssText = 'grid-column: 1/-1; text-align: center;';
                    emptyMsg.textContent = 'Пока здесь пусто. Кто будет первым?';
                    container.innerHTML = '';
                    container.appendChild(emptyMsg);
                    return;
                }

                container.innerHTML = ''; 
                data.forEach(v => {
                    const card = document.createElement('div');
                    card.className = 'trophy-card';

                    const img = document.createElement('img');
                    img.src = v.photo_url || 'https://via.placeholder.com/100?text=RIP';
                    img.className = 'victim-img';
                    img.alt = 'victim';

                    const nameDiv = document.createElement('div');
                    nameDiv.style.cssText = 'color: var(--accent_color); font-weight: bold; text-transform: uppercase;';
                    nameDiv.textContent = v.name;

                    const desc = document.createElement('p');
                    desc.style.cssText = 'font-size: 0.9rem; color: #888;';
                    desc.textContent = v.description;

                    const link = document.createElement('a');
                    link.href = v.link || '#';
                    link.target = '_blank';
                    link.className = 'cta-link';
                    link.textContent = 'Досье';

                    card.appendChild(img);
                    card.appendChild(nameDiv);
                    card.appendChild(desc);
                    card.appendChild(link);

                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '';
                const errorMsg = document.createElement('p');
                errorMsg.style.cssText = 'grid-column: 1/-1; text-align: center; color: #ff3300;';
                errorMsg.textContent = 'Ошибка связи с API.';
                container.appendChild(errorMsg);
            }
        }
        loadVictims();
    </script>
</body>
</html>
