<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTROL PANEL // ОАО МЕГАЛЮЛЬ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050506;
            --surface: #09090b;
            --border: #1f1f22;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #ef4444;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-sans);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper { width: 100%; max-width: 520px; }

        h1 {
            font-family: var(--font-mono); font-size: 16px; font-weight: 600;
            border-bottom: 1px solid var(--border); padding-bottom: 16px;
            margin-bottom: 24px; text-transform: uppercase;
        }

        label {
            display: block; font-family: var(--font-mono); font-size: 11px;
            color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; margin-top: 16px;
        }

        input, textarea {
            width: 100%; background: var(--surface); border: 1px solid var(--border);
            color: var(--text-main); padding: 10px 12px; font-family: var(--font-mono);
            font-size: 13px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--text-main); }
        textarea { min-height: 100px; resize: vertical; }

        button {
            margin-top: 24px; width: 100%; background: var(--text-main); color: var(--bg);
            border: none; padding: 12px; font-family: var(--font-mono); font-weight: 500;
            cursor: pointer; text-transform: uppercase; font-size: 13px;
        }
        button:hover { opacity: 0.85; }

        #msg { margin-top: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>Control Panel // ОАО МЕГАЛЮЛЬ</h1>

        <label>Секретный ключ (ADMIN_KEY)</label>
        <input type="password" id="token" placeholder="Введите ключ доступа...">

        <label>Статус в шапке</label>
        <input type="text" id="status">

        <label>Текст манифеста</label>
        <textarea id="lead_text"></textarea>

        <label>Ссылка на Discord</label>
        <input type="text" id="discord_url">

        <button onclick="saveData()">Сохранить изменения</button>
        <div id="msg">Загрузка данных...</div>
    </div>

    <script>
        // Вставьте сюда URL вашего воркера
        const WORKER_URL = 'https://fragrant-glade-be7f.rexetstios.workers.dev/api';

        async function loadData() {
            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                document.getElementById('status').value = data.status || '';
                document.getElementById('lead_text').value = data.lead_text || '';
                document.getElementById('discord_url').value = data.discord_url || '';
                document.getElementById('msg').textContent = 'Данные загружены.';
            } catch (e) {
                document.getElementById('msg').textContent = '[ERR] Ошибка связи с сервером.';
            }
        }

        async function saveData() {
            const token = document.getElementById('token').value;
            const payload = {
                status: document.getElementById('status').value,
                lead_text: document.getElementById('lead_text').value,
                discord_url: document.getElementById('discord_url').value
            };

            document.getElementById('msg').textContent = 'Сохранение...';

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('msg').style.color = '#4ade80';
                    document.getElementById('msg').textContent = '[OK] Успешно сохранено!';
                } else {
                    document.getElementById('msg').style.color = '#ef4444';
                    document.getElementById('msg').textContent = '[ERR] Неверный секретный ключ.';
                }
            } catch (e) {
                document.getElementById('msg').style.color = '#ef4444';
                document.getElementById('msg').textContent = '[ERR] Ошибка сети.';
            }
        }

        loadData();
    </script>
</body>
</html>
