<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEGALUL HARKOMENS | MARKET</title>
    <style>
        :root { --green: #00ff00; --red: #ff0000; --accent: #ff5500; --bg: #050505; }
        body { background: var(--bg); color: #ccc; font-family: 'Consolas', monospace; margin: 0; padding: 0; text-align: center; }
        
        header { 
            background: #111; padding: 20px; border-bottom: 2px solid var(--accent); 
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
        }
        .logo { color: var(--accent); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; font-size: 1.3rem; }
        
        .container { padding: 30px 20px; max-width: 450px; margin: 0 auto; position: relative; z-index: 10; }
        .product-card { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 20px; }
        
        .product-img { 
            width: 100%; height: 200px; 
            background: url('https://i.imgur.com/Ti2cxHF.jpeg') center/cover; 
            border-radius: 5px; margin-bottom: 20px; filter: contrast(1.2) sepia(0.5); 
        }
        
        .price { color: var(--green); font-size: 1.6rem; font-weight: bold; margin: 15px 0; font-family: 'Courier New', Courier, monospace; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.75rem; color: #666; text-transform: uppercase; display: block; margin-bottom: 5px; letter-spacing: 1px; }
        input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 4px; box-sizing: border-box; outline: none; 
            font-size: 1rem; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 85, 0, 0.3); }

        .btn-buy { 
            background: var(--accent); color: #000; border: none; padding: 18px; 
            font-weight: 900; border-radius: 4px; width: 100%; text-transform: uppercase; 
            cursor: pointer; margin-top: 15px; font-size: 1.1rem; letter-spacing: 1px;
        }

        /* Пранк-оверлей */
        #prank-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; padding: 25px; box-sizing: border-box;
        }
        
        /* ТВОЯ ФОТКА НА ФОНЕ */
        #prank-overlay::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('ТВОЯ_ССЫЛКА_НА_ФОТО') center/cover no-repeat; 
            filter: grayscale(100%) brightness(15%); opacity: 0.25; z-index: -1;
        }
        
        #prank-overlay h1 { color: var(--red); font-size: clamp(2.2rem, 12vw, 5rem); margin: 0; font-weight: 900; line-height: 0.9; }
        #prank-overlay p { color: #fff; text-align: center; font-size: 1.3rem; margin: 25px 0; font-weight: bold; }
        .harkomens-sign { 
            color: var(--accent); font-weight: 900; border: 3px solid var(--accent); 
            padding: 15px 30px; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 2px;
        }
        .btn-back { margin-top: 50px; color: #444; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<header><div class="logo">MEGALUL HARKOMENS / DARK MARKET</div></header>

<div class="container">
    <div class="product-card">
        <div class="product-img"></div>
        <div class="price">0.0052 BTC</div>
        <p style="font-size: 0.85rem; color: #777; margin-bottom: 25px;">Заполните форму для отправки товара. Гарантируем анонимность транзакции через миксеры MEGALUL.</p>
        
        <form id="trapForm">
            <div class="form-group">
                <label>ФИО ПОЛУЧАТЕЛЯ:</label>
                <input type="text" id="fio" placeholder="Полное имя" required>
            </div>
            <div class="form-group">
                <label>АДРЕС (ГОРОД, УЛИЦА, КВАРТИРА):</label>
                <input type="text" id="address" placeholder="Куда доставить?" required>
            </div>
            <div class="form-group">
                <label>ТЕЛЕГРАМ / СВЯЗЬ:</label>
                <input type="text" id="contact" placeholder="@username" required>
            </div>
            <button type="submit" class="btn-buy">КУПИТЬ ТОВАР</button>
        </form>
    </div>
</div>

<div id="prank-overlay">
    <h1>ТЫ ЧЕ, ДОЛБАЁБ?</h1>
    <p>Решил вкинуться запрещенкой? <br>Твои данные теперь у нас.</p>
    <div class="harkomens-sign">MEGALUL HARKOMENS НЕ УВАЖАЕТ НАРКОМАНОВ.</div>
    <a href="/" class="btn-back">Вернуться в реальность →</a>
</div>

<script>
    document.getElementById('trapForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "ПОДКЛЮЧЕНИЕ К BTC...";
        btn.disabled = true;

        const data = {
            fio: document.getElementById('fio').value,
            address: document.getElementById('address').value,
            contact: document.getElementById('contact').value
        };

        try {
            await fetch('/api/send-trap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch (err) {}

        setTimeout(() => {
            document.getElementById('prank-overlay').style.display = 'flex';
            if (window.navigator.vibrate) window.navigator.vibrate([400, 100, 400, 100, 400]);
        }, 1200);
    };
</script>
</body>
</html>
